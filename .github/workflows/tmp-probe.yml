name: Probe review bucket
on:
  workflow_dispatch:
  push:
    branches: [arena/44148675-fluency-app]
    paths: ['.github/workflows/tmp-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Upload a 400 kB binary
        env:
          URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ebzmkhrssgnzmixfsuso.supabase.co' }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          head -c 400000 /dev/urandom > /tmp/big.mp3
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' -m 120 -X POST "$URL/storage/v1/object/course-audio-review/weeks-01-04/ai-trial/probe-big.mp3" -H "Authorization: Bearer $KEY" -H "x-upsert: true" -H 'Content-Type: audio/mpeg' --data-binary @/tmp/big.mp3)
          echo "::warning::big http=$code body=$(head -c 200 /tmp/out.json | tr -d '\n')"
          code2=$(curl -s -o /tmp/sign.json -w '%{http_code}' -m 60 -X POST "$URL/storage/v1/object/sign/course-audio-review/weeks-01-04/ai-trial/probe-big.mp3" -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' -d '{"expiresIn":3600}')
          echo "::warning::sign http=$code2 body=$(head -c 200 /tmp/sign.json | tr -d '\n')"
          signed=$(python3 -c "import json;print(json.load(open('/tmp/sign.json')).get('signedURL',''))")
          echo "::warning::download http=$(curl -s -o /tmp/dl -w '%{http_code}' -m 60 "$URL/storage/v1$signed") bytes=$(wc -c </tmp/dl)"
          echo "::warning::anon_download http=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$URL/storage/v1/object/public/course-audio-review/weeks-01-04/ai-trial/probe-big.mp3")"
