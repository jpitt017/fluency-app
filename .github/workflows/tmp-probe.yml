name: Probe production reachability
on:
  workflow_dispatch:
  push:
    branches: [arena/44148675-fluency-app]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Curl production and supabase
        env:
          SB_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SB_ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          echo "prod: $(curl -s -o /dev/null -w '%{http_code}' -m 20 https://fluency-app-nine.vercel.app/onboarding/placement)"
          echo "sb_url_set: $([ -n "$SB_URL" ] && echo yes || echo no)"
          echo "sb_anon_set: $([ -n "$SB_ANON" ] && echo yes || echo no)"
          echo "e2e_user_set: $([ -n "${{ secrets.E2E_USER_EMAIL }}" ] && echo yes || echo no)"
          echo "sb_probe: $(curl -s -o /dev/null -w '%{http_code}' -m 20 "${SB_URL:-https://ebzmkhrssgnzmixfsuso.supabase.co}/rest/v1/placement_texts_safe?select=id" -H "apikey: ${SB_ANON:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImViem1raHJzc2duem1peGZzdXNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxMjA5MjEsImV4cCI6MjExMDY5NjkyMX0.W_pWAeLld7lrpme3SNkLPlPThEDAZxhJu_rfdIUhDhU}")"
