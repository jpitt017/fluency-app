name: CI — Quality, Prompt Evals, E2E & RLS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      production_ai_test:
        description: 'Run live login, writing and speaking smoke test'
        type: boolean
        default: false
      production_issue_test:
        description: 'Send one production test issue and delete the test user'
        type: boolean
        default: false
      production_placement_test:
        description: 'Answer all placement questions on production, signed out and signed in'
        type: boolean
        default: false
      placement_live:
        description: 'Walk the placement quiz on production, phone and desktop, signed out and in'
        type: boolean
        default: false
      live_prompt_evals:
        description: 'Run the live Groq prompt gate (spends the day''s Groq quota for the app)'
        type: boolean
        default: false

jobs:
  production-ai-test:
    if: github.event_name == 'workflow_dispatch' && inputs.production_ai_test == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run real AI feedback smoke test
        run: node tests/production/ai-feedback.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  production-placement-test:
    if: github.event_name == 'workflow_dispatch' && (inputs.production_placement_test == true || inputs.placement_live == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Answer the whole placement quiz on production
        run: node tests/production/placement.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ebzmkhrssgnzmixfsuso.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  production-issue-test:
    if: github.event_name == 'workflow_dispatch' && inputs.production_issue_test == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Send one production issue and check alert
        run: node scripts/test-production-issue.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  build-and-offline-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:syllabus
      - run: npm run validate:details
      - run: npm run lint
      - run: npm run eval:prompts -- --offline
      - run: npm run test:mediation
      - run: node --experimental-strip-types --test tests/unit/mediation-fallback.test.mjs
      - run: node --test tests/unit/placement.test.mjs
      - run: node --test tests/unit/learner-wording.test.mjs
      - run: node --test tests/unit/learner-errors.test.mjs
      # Input feedback cannot claim success when saving fails, and completion
      # counts only server-checked answers (including approved trial audio).
      - run: node --test tests/unit/week-input-save.test.mjs
      # The actual speaking/writing route and recording helper: weekly work
      # counts only when saved, while feedback survives a progress-save error.
      - run: node --test tests/unit/week-output-counting.test.mjs
      # Finishing grammar and vocabulary: what counts, what may be skipped, and
      # that the score comes from saved rows rather than the browser.
      - run: node --test tests/unit/week-practice-finish.test.mjs
      # The vocabulary exercise bank and its learner projection: no keys or
      # reasons ship to the browser, and every gap has an authored reason.
      - run: node --test tests/unit/vocabulary-exercises.test.mjs
      # The explicit alias list from inflected gap answers to their cards, and
      # that every linked term resolves to an authored card (44 of 44).
      - run: node --test tests/unit/vocabulary-review-link.test.mjs
      - run: node --test tests/unit/vocabulary-word-groups.test.mjs
      # Step 3: gaps inline in the text, one Check, server marking, a11y wiring.
      - run: node --test tests/unit/vocabulary-gap-text.test.mjs
      # The week page and labs wiring: back-to-week, counting, the AI bar, and
      # the Again/Easy line above the review grade buttons.
      - run: node --test tests/unit/learner-week-ui.test.mjs
      - run: node --test tests/unit/chat-language.test.mjs
      - run: node --test tests/unit/ai-route-auth.test.mjs
      - run: node --test tests/unit/usage-messages.test.mjs
      - run: node --test tests/unit/text-utils.test.mjs
      - run: node --test tests/unit/placement-questions.test.mjs
      - run: node --test tests/unit/vercel-ignore-build.test.mjs
      - run: node --test tests/unit/placement-watchdog.test.mjs
      # A test must never send an auth email: fake addresses bounce, and a high
      # bounce rate damages the project's sending domain.
      - run: node --test tests/unit/no-auth-email.test.mjs
      # Pins where an emailed auth link lands: the `type` per flow, `next`
      # encoded once, and no off-site redirect.
      - run: node --test tests/unit/auth-email-links.test.mjs
      # Makes "is the live site current?" answerable: /api/version compares to
      # git rev-parse --short origin/main instead of judging by eye.
      - run: node --test tests/unit/deploy-version.test.mjs
      - run: node --experimental-strip-types --test tests/unit/listening-trial.test.mjs
      - run: node --test tests/unit/listening-audio-pipeline.test.mjs
      - run: node --test tests/unit/listening-audio-delete.test.mjs
      # The player's controls: progress bar, ±5 s, keyboard, touch targets, and
      # that the two-play limit stays gone.
      - run: node --test tests/unit/listening-player-controls.test.mjs
      - run: node --test tests/unit/listening-audio-approval.test.mjs
      - run: node --conditions=react-server --experimental-strip-types --test tests/unit/issue-email.test.mjs
      # A provider failure must never reach a learner in the provider's words.
      # classifier: fake 401, fake 429, daily-quota 429, timeout, raw-text leaks.
      - run: node --test tests/unit/provider-errors.test.mjs
      # The handler's status/body, and that only the four approved sentences ship.
      - run: node --conditions=react-server --experimental-strip-types --test tests/unit/provider-failure-response.test.mjs
      # Alerting: groups per endpoint and kind, never throws, sends no learner data.
      - run: node --conditions=react-server --experimental-strip-types --test tests/unit/provider-alert.test.mjs
      - run: npm run check:live-schema
        env:
          SUPABASE_LIVE_URL: ${{ secrets.SUPABASE_LIVE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ebzmkhrssgnzmixfsuso.supabase.co' }}
          SUPABASE_LIVE_ANON_KEY: ${{ secrets.SUPABASE_LIVE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImViem1raHJzc2duem1peGZzdXNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxMjA5MjEsImV4cCI6MjExMDY5NjkyMX0.W_pWAeLld7lrpme3SNkLPlPThEDAZxhJu_rfdIUhDhU' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

  playwright-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ebzmkhrssgnzmixfsuso.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImViem1raHJzc2duem1peGZzdXNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxMjA5MjEsImV4cCI6MjExMDY5NjkyMX0.W_pWAeLld7lrpme3SNkLPlPThEDAZxhJu_rfdIUhDhU' }}
      # Every user these tests sign in as is created with
      # auth.admin.createUser({ email_confirm: true }); the guard earlier in this
      # job fails the build if a test ever goes back to an email-sending flow.
      - name: Run Playwright E2E tests
        # Includes the placement walk that answers all 24 v2 questions through to
        # the writing step on a phone viewport, the writing-step word counter and
        # hint, both request timeouts, and the service-worker install.
        run: npm run test:e2e -- --reporter=line,github
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ebzmkhrssgnzmixfsuso.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImViem1raHJzc2duem1peGZzdXNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxMjA5MjEsImV4cCI6MjExMDY5NjkyMX0.W_pWAeLld7lrpme3SNkLPlPThEDAZxhJu_rfdIUhDhU' }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL || '' }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD || '' }}
          E2E_STUB_LLM: 'true'
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Turn the Playwright report into readable annotations
        if: always()
        run: |
          node -e '
            const fs = require("node:fs");
            const path = "test-results/.last-run.json";
            if (!fs.existsSync(path)) { console.log("::warning::no .last-run.json"); process.exit(0); }
            const summary = JSON.parse(fs.readFileSync(path, "utf8"));
            for (const test of (summary.failedTests || []).slice(0, 8)) {
              const label = typeof test === "string" ? test : (test.title || test.name || JSON.stringify(test));
              console.log(`::warning title=playwright failure::${String(label).replace(/[\r\n]/g, " ").slice(0, 900)}`);
            }
          '


  # Manual dispatch only, and only with its input ticked. Never on a pull request,
  # and no longer nightly (see docs/CI.md for why and how to bring the schedule back).
  #
  # This job and the product share one GROQ_API_KEY, and the app answers writing
  # feedback with the same openai/gpt-oss-20b on that key. A full pass costs about
  # 220k tokens against a 200k token-per-day organisation cap, so a run spends the
  # day's whole budget — and learners get 429s for the rest of it. That is why it is
  # not a merge gate: prompts still get their fast, deterministic check on every PR
  # through `npm run eval:prompts -- --offline` in build-and-offline-evals.
  #
  # It is also deliberately not a required check: a quota error must not block a
  # merge. The input default keeps a routine dispatch cheap: someone triggering the
  # workflow to smoke-test production does not spend the quota by accident.
  live-prompt-evals:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.live_prompt_evals == true
    steps:
      - name: Check GROQ_API_KEY availability
        id: check
        env:
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
        run: echo "available=$([ -n "$GROQ_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.check.outputs.available == 'true'
      - uses: actions/setup-node@v5
        if: steps.check.outputs.available == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.check.outputs.available == 'true'
      - name: Run 62-case live Groq prompt accuracy & safety gate
        if: steps.check.outputs.available == 'true'
        run: node scripts/eval-prompts.mjs --live
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  isolated-deletion:
    name: Isolated migration and learner-data deletion
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Start local Supabase without project migrations
        run: |
          set -euo pipefail
          exec > >(tee /tmp/supabase-start.log) 2>&1
          report_failure() { while IFS= read -r line; do echo "::error::$line"; done < <(tail -n 12 /tmp/supabase-start.log); }
          trap report_failure ERR
          supabase init
          supabase start
      - name: Check every migration number is unique
        shell: bash
        # Two files shared 0040 for a while (ai_failure_alerts and
        # vocabulary_attempts). Both replayed cleanly on their own, so nothing
        # failed until someone tried to record them in a migration history keyed
        # by that number. Catch the next one at the point it is introduced.
        run: |
          set -euo pipefail
          dups=$(ls supabase-b1-b2/migrations/*.sql | xargs -n1 basename \
                 | sed 's/_.*//' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "::error::Duplicate migration numbers: $dups"
            exit 1
          fi
          echo "all $(ls supabase-b1-b2/migrations/*.sql | wc -l) migration numbers are unique"

      - name: Replay every migration, then test both application orders
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/deletion-ci.log) 2>&1
          report_failure() { while IFS= read -r line; do echo "::error::$line"; done < <(tail -n 8 /tmp/deletion-ci.log); }
          trap report_failure ERR
          host='127.0.0.1'; port=54322; user=postgres
          db="postgresql://${user}:postgres@${host}:${port}/postgres"

          # A real replay: nothing is skipped, so this is exactly what a new
          # environment would build from this repo. Each file is timed and
          # capped individually: a single pathological migration then fails
          # loudly with its own name instead of hanging the job until the
          # runner kills it, which is what happened twice.
          for file in supabase-b1-b2/migrations/*.sql; do
            started=${SECONDS}
            echo "replaying ${file}"
            timeout 300 psql "$db" -v ON_ERROR_STOP=1 -q -f "$file" || {
              echo "::error::${file} failed or took longer than 300s"
              exit 1
            }
            echo "  ${file}: $((SECONDS - started))s"
          done

          psql "$db" -v ON_ERROR_STOP=1 -f tests/database/verify-replay-schema.sql
          psql "$db" -v ON_ERROR_STOP=1 -f tests/database/delete-learning-data.sql

          # Idempotency, without a second replay: applying the later additive
          # migrations again on a database that already has them must change
          # nothing, and the deletion test must still pass. That is the property
          # the two-order version was really checking.
          #
          # 0041 is deliberately not in this list. It anchors on the *unguarded*
          # spelling of the week_output_submissions delete, which 0044 rewrites
          # by design, so 0041-after-0044 is not a state that can occur: the real
          # order is 0041 then 0044, which the replay above already exercises.
          echo "re-applying the additive migrations (must be no-ops)"
          psql "$db" -v ON_ERROR_STOP=1 -q -f supabase-b1-b2/migrations/0043_week_input_answers.sql
          psql "$db" -v ON_ERROR_STOP=1 -q -f supabase-b1-b2/migrations/0044_repair_deletion_function.sql
          psql "$db" -v ON_ERROR_STOP=1 -f tests/database/delete-learning-data.sql

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  rls-isolation:
    runs-on: ubuntu-latest
    steps:
      - name: Check SUPABASE_SERVICE_ROLE_KEY availability
        id: check
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: echo "available=$([ -n "$SERVICE_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.check.outputs.available == 'true'
      - uses: actions/setup-node@v5
        if: steps.check.outputs.available == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.check.outputs.available == 'true'
      - name: Verify live AI limits and pilot access
        if: steps.check.outputs.available == 'true'
        run: node scripts/test-ai-limits.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Verify live issue alert grouping
        if: steps.check.outputs.available == 'true'
        run: node scripts/test-issue-alert-grouping.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Verify Postgres RLS isolation & deletion coverage
        if: steps.check.outputs.available == 'true'
        run: node scripts/test-rls.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
