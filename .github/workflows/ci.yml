name: CI — Quality, Prompt Evals, E2E & RLS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      production_ai_test:
        description: 'Run live login, writing and speaking smoke test'
        type: boolean
        default: false
      production_issue_test:
        description: 'Send one production test issue and delete the test user'
        type: boolean
        default: false

jobs:
  production-ai-test:
    if: github.event_name == 'workflow_dispatch' && inputs.production_ai_test == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run real AI feedback smoke test
        run: node tests/production/ai-feedback.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  production-issue-test:
    if: github.event_name == 'workflow_dispatch' && inputs.production_issue_test == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Send one production issue and check alert
        run: node scripts/test-production-issue.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  changes:
    runs-on: ubuntu-latest
    outputs:
      prompts: ${{ steps.filter.outputs.prompts }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            prompts:
              - 'lib/b1b2/feedback-schema.ts'
              - 'lib/b1b2/prompt-guard.ts'
              - 'src/app/api/**'
              - 'scripts/eval-prompts.mjs'

  build-and-offline-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:syllabus
      - run: npm run validate:details
      - run: npm run lint
      - run: npm run eval:prompts -- --offline
      - run: npm run test:mediation
      - run: node --experimental-strip-types --test tests/unit/mediation-fallback.test.mjs
      - run: node --test tests/unit/placement.test.mjs
      - run: node --test tests/unit/learner-wording.test.mjs
      - run: node --test tests/unit/chat-language.test.mjs
      - run: node --test tests/unit/ai-route-auth.test.mjs
      - run: node --test tests/unit/usage-messages.test.mjs
      - run: node --test tests/unit/learner-grammar.test.mjs
      - run: node --test tests/unit/vocabulary-exercises.test.mjs
      - run: node --test tests/unit/input-marking.test.mjs
      - run: node --test tests/unit/delete-user-storage.test.mjs
      - run: node --conditions=react-server --experimental-strip-types --test tests/unit/issue-email.test.mjs
      - run: npm run check:live-schema
        env:
          SUPABASE_LIVE_URL: ${{ secrets.SUPABASE_LIVE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ebzmkhrssgnzmixfsuso.supabase.co' }}
          SUPABASE_LIVE_ANON_KEY: ${{ secrets.SUPABASE_LIVE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImViem1raHJzc2duem1peGZzdXNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxMjA5MjEsImV4cCI6MjExMDY5NjkyMX0.W_pWAeLld7lrpme3SNkLPlPThEDAZxhJu_rfdIUhDhU' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

  playwright-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ebzmkhrssgnzmixfsuso.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImViem1raHJzc2duem1peGZzdXNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxMjA5MjEsImV4cCI6MjExMDY5NjkyMX0.W_pWAeLld7lrpme3SNkLPlPThEDAZxhJu_rfdIUhDhU' }}
      - name: Run Playwright core-loop E2E tests
        run: npm run test:e2e -- --reporter=line,github
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ebzmkhrssgnzmixfsuso.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImViem1raHJzc2duem1peGZzdXNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxMjA5MjEsImV4cCI6MjExMDY5NjkyMX0.W_pWAeLld7lrpme3SNkLPlPThEDAZxhJu_rfdIUhDhU' }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL || '' }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD || '' }}
          E2E_STUB_LLM: 'true'
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  live-prompt-evals:
    needs: changes
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.prompts == 'true'
    steps:
      - name: Check GROQ_API_KEY availability
        id: check
        env:
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
        run: echo "available=$([ -n "$GROQ_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.check.outputs.available == 'true'
      - uses: actions/setup-node@v5
        if: steps.check.outputs.available == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.check.outputs.available == 'true'
      - name: Run 62-case live Groq prompt accuracy & safety gate
        if: steps.check.outputs.available == 'true'
        run: node scripts/eval-prompts.mjs --live
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  rls-isolation:
    runs-on: ubuntu-latest
    steps:
      - name: Check SUPABASE_SERVICE_ROLE_KEY availability
        id: check
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: echo "available=$([ -n "$SERVICE_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.check.outputs.available == 'true'
      - uses: actions/setup-node@v5
        if: steps.check.outputs.available == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.check.outputs.available == 'true'
      - name: Verify live AI limits and pilot access
        if: steps.check.outputs.available == 'true'
        run: node scripts/test-ai-limits.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Verify live issue alert grouping
        if: steps.check.outputs.available == 'true'
        run: node scripts/test-issue-alert-grouping.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Verify Postgres RLS isolation & deletion coverage
        if: steps.check.outputs.available == 'true'
        run: node scripts/test-rls.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  isolated-deletion:
    name: Isolated migration and learner-data deletion
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Start local Supabase without project migrations
        run: |
          set -euo pipefail
          exec > >(tee /tmp/supabase-start.log) 2>&1
          report_failure() { while IFS= read -r line; do echo "::error::$line"; done < <(tail -n 12 /tmp/supabase-start.log); }
          trap report_failure ERR
          supabase init
          supabase start
      - name: Apply migrations and test both application orders
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/deletion-ci.log) 2>&1
          report_failure() { while IFS= read -r line; do echo "::error::$line"; done < <(tail -n 8 /tmp/deletion-ci.log); }
          trap report_failure ERR
          db='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          for file in supabase-b1-b2/migrations/*.sql; do
            case "$file" in *0038_*|*0039_*|*0040_*|*0041_*) continue;; esac
            psql "$db" -v ON_ERROR_STOP=1 -f "$file"
          done
          psql "$db" -v ON_ERROR_STOP=1 -f tests/database/verify-replay-schema.sql
          psql "$db" -v ON_ERROR_STOP=1 -f supabase-b1-b2/migrations/0039_repair_learning_data_deletion.sql
          psql "$db" -v ON_ERROR_STOP=1 -f tests/database/delete-learning-data.sql
          psql "$db" -v ON_ERROR_STOP=1 -f supabase-b1-b2/migrations/0038_vocabulary_attempts.sql
          psql "$db" -v ON_ERROR_STOP=1 -f tests/database/delete-learning-data.sql
          psql "$db" -v ON_ERROR_STOP=1 -f supabase-b1-b2/migrations/0039_repair_learning_data_deletion.sql
          psql "$db" -v ON_ERROR_STOP=1 -f tests/database/delete-learning-data.sql
          psql "$db" -v ON_ERROR_STOP=1 -f supabase-b1-b2/drafts/0040_week_model_views.sql
          psql "$db" -v ON_ERROR_STOP=1 -f tests/database/delete-learning-data.sql
          psql "$db" -v ON_ERROR_STOP=1 -f supabase-b1-b2/migrations/0041_week_grammar_attempts.sql
          psql "$db" -v ON_ERROR_STOP=1 -f tests/database/delete-learning-data.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  preview-bypass-check:
    name: Protected preview access
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check latest PR preview without exposing secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node <<'NODE'
          (async () => {
            const token = process.env.VERCEL_TOKEN;
            const bypass = process.env.VERCEL_AUTOMATION_BYPASS_SECRET;
            const fail = message => { console.log(`::error::${message}`); process.exitCode = 1; };
            if (!token || !bypass) { fail('Required preview credential is missing'); return; }
            const headers = { Authorization: `Bearer ${token}` };
            const project = await fetch('https://api.vercel.com/v9/projects/fluency-app', { headers });
            if (!project.ok) { fail(`Vercel API HTTP ${project.status}`); return; }
            const projectData = await project.json();
            const { id } = projectData;
            const bypassSettings = projectData.protectionBypass;
            if (bypassSettings && typeof bypassSettings === 'object') {
              const matches = Object.entries(bypassSettings).some(([key, value]) => key === bypass || value === bypass || (value && typeof value === 'object' && Object.values(value).includes(bypass)));
              console.log(matches ? '::notice::Project bypass secret matches GitHub secret' : '::notice::Project bypass secret match not confirmed by API');
            } else console.log('::notice::Project bypass settings not available from API');
            let deployment;
            for (let attempt = 0; attempt < 24; attempt++) {
              const response = await fetch(`https://api.vercel.com/v6/deployments?projectId=${encodeURIComponent(id)}&limit=100`, { headers });
              if (!response.ok) { fail(`Vercel API HTTP ${response.status}`); return; }
              const payload = await response.json();
              deployment = (payload.deployments ?? []).find(d => d.meta?.githubCommitSha === process.env.HEAD_SHA && d.readyState === 'READY' && d.target !== 'production');
              if (deployment) break;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!deployment || !/^[a-z0-9.-]+\.vercel\.app$/i.test(deployment.url)) { fail('Latest preview was not found or is not ready'); return; }
            let url = new URL(`https://${deployment.url}/`);
            let response;
            let redirects = 0;
            for (; redirects < 10; redirects++) {
              response = await fetch(url, { headers: url.hostname === deployment.url ? { 'x-vercel-protection-bypass': bypass } : {}, redirect: 'manual' });
              const location = response.headers.get('location');
              if (response.status < 300 || response.status >= 400 || !location) break;
              url = new URL(location, url);
              const safeLocation = `${url.host}${url.pathname}`.replaceAll(bypass, '[redacted]').replaceAll(token, '[redacted]');
              console.log(`::notice::Redirect host and path: ${safeLocation}`);
              if (url.protocol !== 'https:') { fail('Unsafe redirect'); return; }
            }
            if (redirects === 0) console.log('::notice::Redirect host and path: none');
            if (redirects === 10) { fail('Too many redirects'); return; }
            const page = await response.text();
            if (response.status === 200 && url.hostname === deployment.url && page.includes('Fluency Studio') && !page.includes('Authentication Required')) console.log('::notice::bypass works');
            else fail(`Final HTTP ${response.status}`);
          })().catch(() => { console.log('::error::Preview check failed before receiving a response'); process.exitCode = 1; });
          NODE
