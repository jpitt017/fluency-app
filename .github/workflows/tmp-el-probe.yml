name: Probe ElevenLabs
on:
  workflow_dispatch:
  push:
    branches: [arena/44148675-fluency-app]
    paths: ['.github/workflows/tmp-el-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Voice inventory
        env:
          EL: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          curl -s -m 30 https://api.elevenlabs.io/v1/voices -H "xi-api-key: $EL" -o /tmp/voices.json
          python3 -c "
import json
want={'sp7QaEHmiNEd5HgrXuOo':'Host','VGEVi3E0hARQ99wIXvJG':'Ellie','jUPSOpRcPt8GMPsWx5fy':'Aisha','EtGAAwTx6aMveVbqUxuU':'Tom','sBU90Bu4NCleWDoNkGog':'Dan','FmIJwVFU62n8jITpotTp':'Marta','ZR8ruiC9tbg7bV9RmBmC':'Joanne'}
d=json.load(open('/tmp/voices.json')).get('voices',[])
have={v.get('voice_id'):v for v in d}
print('::warning::voice_count='+str(len(d)))
for vid,role in want.items():
    v=have.get(vid)
    if not v:
        print('::warning::MISSING '+role+' '+vid); continue
    lab=v.get('labels') or {}
    print('::warning::OK '+role+' '+vid+' name='+str(v.get('name'))+' accent='+str(lab.get('accent'))+' gender='+str(lab.get('gender'))+' desc='+str(lab.get('description'))+' use='+str(lab.get('use_case')))
"
