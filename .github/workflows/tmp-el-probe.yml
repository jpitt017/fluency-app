name: Probe ElevenLabs
on:
  workflow_dispatch:
  push:
    branches: [arena/44148675-fluency-app]
    paths: ['.github/workflows/tmp-el-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Voice inventory
        env:
          EL: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          curl -s -m 30 https://api.elevenlabs.io/v1/voices -H "xi-api-key: $EL" -o /tmp/voices.json
          python3 -c "import json;w={'sp7QaEHmiNEd5HgrXuOo':'Host','VGEVi3E0hARQ99wIXvJG':'Ellie','jUPSOpRcPt8GMPsWx5fy':'Aisha','EtGAAwTx6aMveVbqUxuU':'Tom','sBU90Bu4NCleWDoNkGog':'Dan','FmIJwVFU62n8jITpotTp':'Marta','ZR8ruiC9tbg7bV9RmBmC':'Joanne'};d=json.load(open('/tmp/voices.json')).get('voices',[]);h={v.get('voice_id'):v for v in d};print('::warning::voice_count='+str(len(d)));[print('::warning::MISSING '+r+' '+i) if i not in h else print('::warning::OK '+r+' '+i+' name='+str(h[i].get('name'))+' accent='+str((h[i].get('labels') or {}).get('accent'))+' gender='+str((h[i].get('labels') or {}).get('gender'))+' use='+str((h[i].get('labels') or {}).get('use_case'))+' desc='+str((h[i].get('labels') or {}).get('description'))) for i,r in w.items()]"
