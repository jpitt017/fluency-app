name: Probe ElevenLabs
on:
  workflow_dispatch:
  push:
    branches: [arena/44148675-fluency-app]
    paths: ['.github/workflows/tmp-el-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Voice inventory
        env:
          EL: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          curl -s -m 30 https://api.elevenlabs.io/v1/voices -H "xi-api-key: $EL" -o /tmp/voices.json
          echo "::warning::voice_count=$(python3 -c "import json;print(len(json.load(open('/tmp/voices.json')).get('voices',[])))")"
          python3 - <<'PYEOF'
import json
want = {
 'sp7QaEHmiNEd5HgrXuOo':'Host','VGEVi3E0hARQ99wIXvJG':'Ellie','jUPSOpRcPt8GMPsWx5fy':'Aisha',
 'EtGAAwTx6aMveVbqUxuU':'Tom','sBU90Bu4NCleWDoNkGog':'Dan','FmIJwVFU62n8jITpotTp':'Marta',
 'ZR8ruiC9tbg7bV9RmBmC':'Joanne'}
d = json.load(open('/tmp/voices.json')).get('voices', [])
have = {v.get('voice_id'): v for v in d}
for vid, role in want.items():
    v = have.get(vid)
    if not v:
        print(f"::warning::MISSING {role} {vid}")
        continue
    lab = v.get('labels') or {}
    print(f"::warning::OK {role} {vid} name={v.get('name')} accent={lab.get('accent')} gender={lab.get('gender')} desc={lab.get('description')} age={lab.get('age')}")
print(f"::warning::unlisted_count={len([1 for vid in have if vid not in want])}")
PYEOF
