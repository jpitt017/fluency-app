name: Probe ElevenLabs
on:
  workflow_dispatch:
  push:
    branches: [arena/44148675-fluency-app]
    paths: ['.github/workflows/tmp-el-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: PCM format probe
        env:
          EL: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          for fmt in pcm_24000 pcm_22050 pcm_44100; do
            code=$(curl -s -o "/tmp/$fmt.pcm" -w '%{http_code}' -m 60 -X POST "https://api.elevenlabs.io/v1/text-to-speech/sp7QaEHmiNEd5HgrXuOo?output_format=$fmt" \
              -H "xi-api-key: $EL" -H 'Content-Type: application/json' \
              -d '{"text":"The quick brown fox jumps over the lazy dog, and then reads a very ordinary sentence aloud for exactly one minute.","model_id":"eleven_multilingual_v2","voice_settings":{"stability":0.5,"similarity_boost":0.75,"speed":0.95}}')
            echo "::warning::fmt $fmt http=$code bytes=$(wc -c <"/tmp/$fmt.pcm")"
          done
          echo "::warning::chars_header=$(curl -s -D - -o /dev/null -m 60 -X POST 'https://api.elevenlabs.io/v1/text-to-speech/sp7QaEHmiNEd5HgrXuOo?output_format=pcm_24000' -H "xi-api-key: $EL" -H 'Content-Type: application/json' -d '{"text":"Hi.","model_id":"eleven_multilingual_v2"}' | tr -d '\r' | grep -i 'x-character-count')"
