# Course audio — AI trial tracks for Weeks 1–4 listening.
#
# Manual only: nothing here runs on a push or a pull request.
#
# `mode` is the approval workflow:
#   voice-check  synthesise a few real lines per speaker (one clip per speaker
#                plus the named step clips), upload them to the private review
#                bucket and attach them as the `voice-check` artifact, so the
#                voices and their settings can be approved before a whole week is
#                recorded. Reports words per minute per clip.
#   generate     synthesise the tracks, upload them to `course-audio-review`
#                (private) as UNRELEASED (source "ai-trial", no live audioUrl),
#                attach them as the `review` artifact (MP3 + WebVTT, 3 days) and
#                print the state. Never prints a signed link.
#   voice-sample re-audition one week on each speaker's three longest lines, at
#                a given pace (default `b1`: speed 0.8, 0.5/0.7/1.0 s pauses),
#                with that week's voice settings. Nothing is re-recorded or
#                released.
#   delete-probes delete the three storage-check probe objects by exact name,
#                through the Storage API (dry run unless confirm)
#   review       print a 1-hour signed listening link for the weeks chosen
#   release      approve reviewed weeks: copy them to the public `course-audio`
#                bucket, set audio_url + released = true, so /week/[n] shows the
#                player labelled "AI voice – trial recording"
#   revoke       un-approve: learners go back to "Audio coming soon.", and the
#                public copy is removed again
#   delete       delete a week's MP3 + VTT from both buckets and clear its URLs;
#                the row stays unreleased. Dry run unless `confirm` is set;
#                refuses released weeks and any path outside weeks-01-04/ai-trial/
#   list         show the approval state of every track
#
# release and revoke are refused on the production project: a week is never
# marked released there, not even briefly for a test. Rehearse against a preview
# database, or opt in explicitly with allow_production_release plus the
# acknowledgement phrase for a deliberate, human-reviewed release (see
# docs/CONTENT_PIPELINE.md section 6).
#
# Secret required: ELEVENLABS_API_KEY (repository secret). The Supabase URL and
# service-role key are the ones CI already uses for the live project.
name: Course audio — AI trial tracks

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'voice-check | voice-sample | generate | review | release | revoke | delete | delete-probes | list'
        type: choice
        options: [voice-check, voice-sample, generate, review, release, revoke, delete, delete-probes, list]
        default: voice-check
      weeks:
        description: 'Weeks to act on (comma separated, 1–4; ignored by voice-check, one week only for voice-sample)'
        type: string
        default: '1,2,3,4'
      pace:
        description: 'voice-sample: pace profile (b1 is the course pace)'
        type: choice
        options: [b1]
        default: b1
      dry_run:
        description: 'generate: report speakers and length, generate nothing'
        type: boolean
        default: false
      confirm:
        description: 'delete / delete-probes: actually delete (off = dry run). Never applies to a released week'
        type: boolean
        default: false
      allow_production_release:
        description: 'release/revoke: override the production refusal. Only for a deliberate, reviewed release'
        type: boolean
        default: false
      production_ack:
        description: 'release/revoke on production: type "release to learners" to acknowledge the override'
        type: string
        default: ''

concurrency:
  group: course-audio
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ebzmkhrssgnzmixfsuso.supabase.co' }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  # Approval writes refuse production unless this run explicitly opts in with
  # both the checkbox and the acknowledgement. A week is never marked released on
  # production, not even briefly for a test - this is the deliberate-release path
  # only, and the scripts enforce the same rule from their side.
  ALLOW_PRODUCTION_RELEASE: ${{ inputs.allow_production_release && inputs.production_ack == 'release to learners' && '1' || '' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install ffmpeg (MP3 encoding)
        if: ${{ inputs.mode == 'generate' || inputs.mode == 'voice-check' || inputs.mode == 'voice-sample' }}
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Check ELEVENLABS_API_KEY availability
        if: ${{ (inputs.mode == 'generate' && !inputs.dry_run) || inputs.mode == 'voice-check' || inputs.mode == 'voice-sample' }}
        env:
          ELEVENLABS_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$ELEVENLABS_KEY" ]; then
            echo "::error::The ELEVENLABS_API_KEY repository secret is not set. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Refuse an unacknowledged approval write on production
        if: ${{ (inputs.mode == 'release' || inputs.mode == 'revoke') && inputs.allow_production_release && inputs.production_ack != 'release to learners' }}
        run: |
          echo "::error::release/revoke on the production project needs the acknowledgement phrase. A week is never marked released on production for a test: use a preview database, a fake week number learners cannot open, or a unit test with a fake client."
          exit 1

      - name: Warn that this run writes approval state on production
        if: ${{ (inputs.mode == 'release' || inputs.mode == 'revoke') && inputs.allow_production_release && inputs.production_ack == 'release to learners' }}
        run: echo "::warning::Approval state is being written on the production project. This is only legitimate as a deliberate, human-reviewed release - never as a test."

      - name: Check SUPABASE_SERVICE_ROLE_KEY availability
        if: ${{ inputs.mode != 'generate' || !inputs.dry_run }}
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SERVICE_KEY" ]; then
            echo "::error::The SUPABASE_SERVICE_ROLE_KEY repository secret is not set."
            exit 1
          fi

      - name: Validate the authored listening scripts
        if: ${{ inputs.mode == 'generate' }}
        run: npm run validate:details

      - name: Show the planned tracks
        if: ${{ inputs.mode == 'generate' }}
        run: node scripts/generate-course-audio.mjs --weeks "${{ inputs.weeks }}" --dry-run

      - name: Voice check — real lines per speaker, words per minute reported
        if: ${{ inputs.mode == 'voice-check' }}
        run: node scripts/generate-course-audio.mjs --voice-check
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

      # The signed links in the step summary are not usable outside the run page
      # (GitHub redacts the token when it renders them), so the clips themselves
      # travel as an artifact.
      - name: Voice check clips for a listen
        if: ${{ inputs.mode == 'voice-check' }}
        uses: actions/upload-artifact@v7
        with:
          name: voice-check
          path: voice-check/
          retention-days: 3

      # Each speaker's three longest lines, at the week's pace and voice
      # settings, before a whole track is re-recorded. No approval row is touched.
      - name: Voice sample — each speaker's three longest lines
        if: ${{ inputs.mode == 'voice-sample' }}
        run: node scripts/generate-course-audio.mjs --voice-sample "${{ inputs.weeks }}" --pace "${{ inputs.pace }}"
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

      - name: Voice sample clips for a listen
        if: ${{ inputs.mode == 'voice-sample' }}
        uses: actions/upload-artifact@v7
        with:
          name: week-sample
          path: voice-samples/
          retention-days: 3

      - name: Generate, upload unreleased, record approval state
        if: ${{ inputs.mode == 'generate' && !inputs.dry_run }}
        run: node scripts/generate-course-audio.mjs --weeks "${{ inputs.weeks }}"
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # Signed review links stay out of the log: the tracks travel as the
          # `review` artifact below.
          SIGNED_LINKS_IN_LOG: ''

      # Only the review mode hands out links, and only because its whole job is
      # listening to a track that already exists. Generate runs never print one.
      - name: Review links (signed, valid 1 hour)
        if: ${{ inputs.mode == 'review' }}
        run: node scripts/generate-course-audio.mjs --review "${{ inputs.weeks }}"
        env:
          SIGNED_LINKS_IN_LOG: '1'

      - name: Release approved weeks
        if: ${{ inputs.mode == 'release' }}
        run: node scripts/generate-course-audio.mjs --release "${{ inputs.weeks }}"

      - name: Revoke a track
        if: ${{ inputs.mode == 'revoke' }}
        run: node scripts/generate-course-audio.mjs --revoke "${{ inputs.weeks }}"

      - name: Delete the three storage-check probe objects (dry run unless confirm)
        if: ${{ inputs.mode == 'delete-probes' }}
        run: |
          if [ "${{ inputs.confirm }}" = "true" ]; then
            node scripts/generate-course-audio.mjs --delete-probes --confirm
          else
            node scripts/generate-course-audio.mjs --delete-probes
          fi

      - name: Delete the files from both buckets (dry run unless confirm)
        if: ${{ inputs.mode == 'delete' }}
        run: |
          if [ "${{ inputs.confirm }}" = "true" ]; then
            node scripts/generate-course-audio.mjs --delete-trial --weeks "${{ inputs.weeks }}" --confirm
          else
            node scripts/generate-course-audio.mjs --delete-trial --weeks "${{ inputs.weeks }}"
          fi

      - name: Approval state
        if: ${{ inputs.mode == 'generate' && !inputs.dry_run || inputs.mode == 'release' || inputs.mode == 'revoke' || inputs.mode == 'delete' || inputs.mode == 'list' }}
        run: node scripts/generate-course-audio.mjs --list

      - name: Run the audio pipeline tests
        run: node --test tests/unit/listening-audio-pipeline.test.mjs tests/unit/listening-trial.test.mjs tests/unit/listening-audio-delete.test.mjs tests/unit/listening-audio-approval.test.mjs

      # MP3 + WebVTT for each generated week, so a week can be listened to (with
      # captions) before anyone approves it.
      - name: Tracks for a listen (MP3 + captions)
        if: ${{ inputs.mode == 'generate' && !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: review
          path: |
            audio-out/weeks-01-04/*.mp3
            audio-out/weeks-01-04/*.vtt
          retention-days: 3
